services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sim_armada
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy-network

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
    networks:
      - proxy-network

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - proxy-network

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881-7882:7881-7882/udp"

volumes:
  postgres_data:

networks:
  proxy-network:
    external: true
