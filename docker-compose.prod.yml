services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: sim_armada
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pyrofar_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - pyrofar_net

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supersecret123}
    volumes:
      - minio_data:/data
    networks:
      - pyrofar_net

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --dev
    ports:
      - "7880:7880"
      - "7881-7882:7881-7882/udp"
    networks:
      - pyrofar_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sim_armada
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-supersecret123}
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      - postgres
      - redis
      - minio
      - livekit
    volumes:
      - uploads_data:/app/uploads
    networks:
      - pyrofar_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sim_armada
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-supersecret123}
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      - postgres
      - redis
      - minio
      - livekit
    networks:
      - pyrofar_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - pyrofar_net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - livekit
    networks:
      - pyrofar_net

networks:
  pyrofar_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:
  caddy_data:
  caddy_config:
