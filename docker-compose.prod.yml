services:
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supersecret123}
    volumes:
      - minio_data:/data
    networks:
      - proxy-network

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --dev
    ports:
      - "7880:7880"
      - "7881-7882:7881-7882/udp"
    networks:
      - proxy-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-supersecret123}
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      - minio
      - livekit
    volumes:
      - uploads_data:/app/uploads
    networks:
      - proxy-network
      - backend-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-supersecret123}
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      - minio
      - livekit
    networks:
      - backend-network
      - proxy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
  backend-network:
    external: true

volumes:
  minio_data:
  uploads_data:
